name: Build FC Teugn Mac test version
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fc-teugn-mac-test
  cancel-in-progress: false
jobs:
  mac:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build both Mac architectures and run policy checks
        id: build
        shell: bash
        run: bash build.sh
      - name: Save test package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fc-teugn-mac-test
          path: |
            ${{ steps.build.outputs.directory }}/*-TEST.zip
            ${{ steps.build.outputs.directory }}/SHA256.txt
          retention-days: 1
          if-no-files-found: error
